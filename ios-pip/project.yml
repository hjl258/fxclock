# 用 XcodeGen 一键生成 Xcode 工程： brew install xcodegen && xcodegen generate
name: ClockPiP
options:
  bundleIdPrefix: com.fxclock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  ClockPiP:
    type: application
    platform: iOS
    sources:
      - path: ClockPiP
    settings:
      base:
        INFOPLIST_FILE: ClockPiP/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.fxclock.ClockPiP
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework

# 显式声明共享 scheme：XcodeGen 默认不生成 scheme 文件，
# 不写这段的话 xcodebuild -scheme ClockPiP 会直接报 "does not contain a scheme"
schemes:
  ClockPiP:
    build:
      targets:
        ClockPiP: all
    run:
      config: Debug
    archive:
      config: Release
