<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页 · 悬浮窗</title>
<style>
html, body { margin: 0; padding: 0; width: 375px; }
img { object-fit: contain; display: block; }
.switch-el { -webkit-appearance: none; appearance: none; width: 42px; height: 24px; border-radius: 12px; background: #e2e6ee; position: relative; }
.switch-el:checked { background: #3b7ff0; }
.switch-el::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
.switch-el:checked::after { left: 20px; }
body {
  background: #eef1f7;
  color: #1b1f2a;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14.000px;
  -webkit-font-smoothing: antialiased;
}

.body {
  position: relative;
  min-height: 100vh;
}

/* 背景：柔和径向渐变 + 斜向光带 */
.bg {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
  background:
    radial-gradient(52% 38% at 84% 58%, rgba(118, 226, 212, 0.40) 0%, rgba(118, 226, 212, 0) 70%),
    radial-gradient(44% 30% at 4% 60%, rgba(246, 192, 212, 0.50) 0%, rgba(246, 192, 212, 0) 72%),
    radial-gradient(70% 34% at 52% 100%, rgba(176, 202, 255, 0.55) 0%, rgba(176, 202, 255, 0) 72%),
    linear-gradient(180deg, #f3f5fa 0%, #e9edf6 52%, #e5eaf5 100%);
}

.bg-band {
  position: fixed;
  left: -30%;
  top: 30%;
  width: 160%;
  height: 34%;
  z-index: 0;
  transform: rotate(-9deg);
  background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 48%, rgba(255, 255, 255, 0) 100%);
}

.page-body {
  position: relative;
  z-index: 1;
  padding-bottom: 110.000px;
}

/* 自定义导航栏 */
.nav {
  position: relative;
  z-index: 2;
  box-sizing: content-box;
}

.nav-row {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 12.000px 0 16.000px;
}

.nav-title {
  font-size: 21.000px;
  font-weight: 700;
  color: #16181f;
  letter-spacing: 0.500px;
}

.nav-gap {
  flex: 1;
}



.tap {
  opacity: 0.7;
}

/* 通用卡片 */
.card-skin {
  background: linear-gradient(150deg, #eef6fe 0%, #e9f0fd 58%, #eaf1fb 100%);
  border-radius: 14.000px;
  box-shadow: 0 6.000px 15.000px rgba(120, 150, 200, 0.10);
}

/* 主按钮 */
.primary-btn {
  margin: 8.000px 14.000px 0;
  height: 52.000px;
  border-radius: 13.000px;
  background: linear-gradient(135deg, #5aa9f8 0%, #3b7ff0 56%, #2f6ff0 100%);
  box-shadow: 0 7.000px 15.000px rgba(59, 127, 240, 0.32);
  color: #ffffff;
  font-size: 18.000px;
  font-weight: 600;
  letter-spacing: 1.500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 分段控件 */
.seg {
  display: flex;
  align-items: center;
  background: #eef1f8;
  border-radius: 8.000px;
  padding: 2.000px;
}

.seg-item {
  padding: 5.000px 10.000px;
  font-size: 12.000px;
  color: #5a6478;
  border-radius: 6.000px;
}

.seg-on {
  background: #ffffff;
  color: #2f6fd0;
  font-weight: 600;
  box-shadow: 0 2.000px 5.000px rgba(140, 160, 200, 0.20);
}

.seg-lg .seg-item {
  flex: 1;
  text-align: center;
  padding: 8.000px 0;
  font-size: 13.000px;
}

/* 行设置 */
.row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.16);
}

.row-item:last-child {
  border-bottom: none;
}

.row-label {
  font-size: 14.000px;
  color: #2c3140;
}

.row-value {
  font-size: 13.000px;
  color: #8b93a7;
}

.switch-s {
  transform: scale(0.78);
}

/* 底部弹层 */
.mask {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  background: rgba(18, 24, 38, 0.34);
  /* 必须高于自定义 TabBar(z-index 60)，否则弹层会被底栏压住 */
  z-index: 300;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 301;
  background: #ffffff;
  border-radius: 17.000px 17.000px 0 0;
  /* 只留左右内边距：上下留白挪进标题栏/滚动区，否则弹层边缘会出现
     既不能滚、又会把触摸放给页面的死区 */
  padding: 0 16.000px;
  box-shadow: 0 -6.000px 20.000px rgba(30, 45, 80, 0.18);
  max-height: 78vh;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden; /* 滚动交给里面的 scroll-view，页面本身不再滚 */
}

/* 弹层主体：撑满剩余高度，自身可滚
   （真机的滚动由 <scroll-view scroll-y> 处理，overflow 是给网页预览兜底的） */
.sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding-bottom: calc(24.000px + env(safe-area-inset-bottom));
}

.sheet-head {
  padding-top: 16.000px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6.000px;
}

.sheet-title {
  font-size: 17.000px;
  font-weight: 700;
  color: #16181f;
}

.sheet-close {
  width: 20.000px;
  height: 20.000px;
  opacity: 0.5;
}

.sheet-group {
  margin-top: 13.000px;
}

.sheet-group-title {
  font-size: 12.000px;
  color: #8b93a7;
  letter-spacing: 0.500px;
}

.radio-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 46.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.14);
}

.radio-row:last-child {
  border-bottom: none;
}

.radio-label {
  font-size: 14.000px;
  color: #2c3140;
}

.radio-icon {
  width: 20.000px;
  height: 20.000px;
}

/* 页面级标题 */
.section-title {
  display: flex;
  align-items: baseline;
  margin: 13.000px 16.000px 0;
}

.section-title-main {
  font-size: 17.000px;
  font-weight: 700;
  color: #16181f;
}

.section-title-sub {
  margin-left: 7.000px;
  font-size: 12.000px;
  color: #8b93a7;
}

.mono {
  font-family: "DIN Alternate", "SF Pro Display", "Helvetica Neue", -apple-system, sans-serif;
  font-variant-numeric: tabular-nums;
}
/* ---------- 抢购卡片 ---------- */
.event-card {
  position: relative;
  margin: 11.000px 14.000px 0;
  padding: 13.000px 13.000px 11.000px;
  border-radius: 14.000px;
  overflow: hidden;
  background: linear-gradient(150deg, #eef6fe 0%, #e8f0fd 58%, #eaf1fb 100%);
  box-shadow: 0 6.000px 15.000px rgba(120, 150, 200, 0.12);
}

.ribbon {
  position: absolute;
  right: 0;
  top: 0;
  width: 33.000px;
  height: 33.000px;
  border-bottom-left-radius: 13.000px;
  background: linear-gradient(180deg, #ddecfd 0%, #cbe0fc 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.ribbon-icon {
  width: 18.000px;
  height: 18.000px;
  margin-left: 4.000px;
  margin-top: -3.000px;
}

.event-head {
  display: flex;
  align-items: center;
  padding-right: 30.000px;
}

.event-thumb {
  flex: none;
  width: 23.000px;
  height: 23.000px;
  border-radius: 6.500px;
  margin-right: 8.000px;
  background: linear-gradient(160deg, #5aa9f6 0%, #2f78ee 100%);
  box-shadow: 0 3.000px 7.000px rgba(47, 120, 238, 0.28);
  display: flex;
  align-items: center;
  justify-content: center;
}

.event-thumb-icon {
  width: 15.000px;
  height: 15.000px;
}

.event-title {
  flex: 1;
  font-size: 14.000px;
  color: #1b1f2a;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.event-mid {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-top: 9.000px;
}

.price {
  display: flex;
  align-items: baseline;
  color: #ff6a00;
}

.price-sym {
  font-size: 13.000px;
  font-weight: 600;
  margin-right: 2.000px;
}

.price-num {
  font-size: 21.000px;
  font-weight: 700;
  letter-spacing: 0.500px;
}

.cd-label {
  font-size: 12.000px;
  color: #8b93a7;
}

.event-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8.000px;
}

.event-target {
  font-size: 13.000px;
  color: #8b93a7;
}

.digits {
  display: flex;
  align-items: center;
}

.digit {
  min-width: 28.000px;
  height: 28.000px;
  padding: 0 3.000px;
  border-radius: 6.000px;
  background: #ffffff;
  box-shadow: 0 2.000px 6.000px rgba(120, 150, 200, 0.14);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16.000px;
  font-weight: 700;
  color: #1b1f2a;
}

.colon {
  font-size: 13.000px;
  color: #8b93a7;
  margin: 0 4.000px;
}

.digit-last {
  margin-left: 9.000px;
  min-width: 24.000px;
}

.card-live {
  background: linear-gradient(150deg, #fff1ec 0%, #ffe7e0 100%);
  box-shadow: 0 6.000px 15.000px rgba(255, 120, 80, 0.18);
}

.card-live .cd-label,
.card-live .price,
.card-live .price-num {
  color: #ff4d2d;
}

.card-done {
  opacity: 0.72;
}

/* ---------- 环形时钟 ---------- */
.ring-wrap {
  display: flex;
  justify-content: center;
  margin-top: 28.000px;
}

/* ---------- 时间源 ---------- */
.quick-panel {
  display: flex;
  align-items: center;
  margin: 36.000px 14.000px 0;
  padding: 11.000px 13.000px;
  border-radius: 14.000px;
  background: rgba(255, 255, 255, 0.82);
  box-shadow: 0 6.000px 14.000px rgba(120, 150, 200, 0.12);
}

.quick-circle {
  flex: none;
  width: 48.000px;
  height: 48.000px;
  border-radius: 50%;
  background: linear-gradient(180deg, #fdfeff 0%, #eef1f8 100%);
  box-shadow: 0 4.000px 10.000px rgba(140, 160, 200, 0.16), inset 0 0 0 0.500px rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
}

.quick-icon {
  width: 22.000px;
  height: 22.000px;
}

.quick-texts {
  flex: 1;
  margin-left: 11.000px;
}

.quick-title {
  display: block;
  font-size: 14.000px;
  color: #2c3140;
}

.quick-sub {
  display: block;
  margin-top: 3.000px;
  font-size: 12.000px;
  color: #8b93a7;
}

.quick-chevron {
  width: 15.000px;
  height: 15.000px;
}

/* ---------- 收起 / 展开 ---------- */
.collapse {
  display: flex;
  justify-content: center;
  margin: 15.000px 0 3.000px;
}

.collapse-icon {
  width: 18.000px;
  height: 18.000px;
  opacity: 0.6;
}

.panel {
  margin: 6.000px 14.000px 0;
  padding: 2.000px 13.000px;
  border-radius: 12.000px;
  background: rgba(255, 255, 255, 0.74);
  box-shadow: 0 5.000px 12.000px rgba(140, 160, 200, 0.12);
}

.panel-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 50.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.16);
}

.panel-row:last-child {
  border-bottom: none;
}

.panel-label {
  font-size: 14.000px;
  color: #2c3140;
}

/* ---------- 弹层补充 ---------- */
.radio-left {
  display: flex;
  flex-direction: column;
}

.radio-desc {
  margin-top: 3.000px;
  font-size: 11.000px;
  color: #98a0b3;
}

.sheet-btn {
  margin-top: 20.000px;
}
/* 环形时钟：纯 DOM + SVG（尺寸基准 250.000px，与 utils/ringSvg.js 的 500 单位一一对应） */
.ring {
  position: relative;
}

/* 外盘：渐变底 + 投影（原 canvas 第 1 步） */
.ring-face {
  position: absolute;
  left: 2.000px;
  top: 2.000px;
  right: 2.000px;
  bottom: 2.000px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ffffff 0%, #fbfcfe 45%, #e8ecf5 100%);
  box-shadow: 0 7.000px 21.000px rgba(118, 136, 178, 0.30);
}

/* 内盘：径向渐变（原 canvas 第 2 步） */
.ring-face-inner {
  position: absolute;
  left: 16.750px;
  top: 16.750px;
  right: 16.750px;
  bottom: 16.750px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 28%, #ffffff 0%, #f7f8fc 72%, #eef1f8 100%);
}

/* 内外盘之间的高光分隔线（原 canvas 第 3 步） */
.ring-face-line {
  position: absolute;
  left: 10.500px;
  top: 10.500px;
  right: 10.500px;
  bottom: 10.500px;
  border-radius: 50%;
  border: 1.000px solid rgba(255, 255, 255, 0.85);
}

/* 刻度 + 四色定位点（静态 SVG，只算一次） */
.ring-ticks,
.ring-arc {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* 中央内容必须压在所有图形之上 */
.ring-center {
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.ring-badge {
  width: 46.000px;
  height: 46.000px;
  border-radius: 13.000px;
  background: linear-gradient(180deg, #f2f4ff 0%, #e9ecfb 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 13.000px;
}

.ring-badge-icon {
  width: 25.000px;
  height: 25.000px;
}

.ring-time {
  font-size: 36.000px;
  font-weight: 700;
  color: #1b1f2a;
  letter-spacing: 0.500px;
  line-height: 1;
}

.ring-sub {
  margin-top: 10.000px;
  font-size: 13.000px;
  color: #98a0b3;
  letter-spacing: 0.500px;
}

/* 深色卡片：自己就是唯一可交互元素 */
.float-pill {
  position: fixed;
  z-index: 200;
  box-sizing: border-box;
  padding: 7.000px 10.000px 6.000px;
  border-radius: 13.000px;
  background: linear-gradient(165deg, #4a5464 0%, #3c4553 45%, #333b48 100%);
  box-shadow: 0 8.000px 18.000px rgba(10, 14, 24, 0.42), inset 0 0 0 0.500px rgba(255, 255, 255, 0.06);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* 顶部：延迟 + 时间源 */
.fp-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* 左半边：延迟与「点击」状态在同一组，时间源仍靠右 */
.fp-head-left {
  display: flex;
  align-items: center;
}

.fp-latency {
  flex: none;
}

/* 「点击」+ 状态圆：扫描定时点击列表，存在 ±5 分钟内的项 → 绿点，否则红点 */
.fp-click {
  display: flex;
  align-items: center;
  margin-left: 8.000px;
}

.fp-click-label {
  font-size: 11.000px;
  color: rgba(255, 255, 255, 0.62);
  letter-spacing: 0.500px;
}

.fp-click-dot {
  width: 8.000px;
  height: 8.000px;
  border-radius: 50%;
  margin-left: 4.000px;
}

.fp-click-dot-on {
  background: #37b24d;
  box-shadow: 0 0 6.000px rgba(55, 178, 77, 0.95);
}

.fp-click-dot-off {
  background: #ef5b45;
  box-shadow: 0 0 6.000px rgba(239, 91, 69, 0.85);
}

.fp-latency {
  font-size: 12.000px;
  color: rgba(255, 255, 255, 0.62);
  letter-spacing: 0.500px;
}

.fp-source {
  font-size: 13.000px;
  color: rgba(255, 255, 255, 0.72);
  letter-spacing: 0.500px;
}

/* 中间：大字时间，最后一位橙色 */
.fp-main {
  display: flex;
  align-items: baseline;
  justify-content: center;
  margin-top: 1.000px;
}

.fp-time {
  font-size: 30.000px;
  font-weight: 500;
  color: #ffffff;
  letter-spacing: 0.500px;
  line-height: 1;
}

.fp-tenth {
  font-size: 34.000px;
  font-weight: 700;
  color: #ee5a2e;
  line-height: 1;
  margin-left: 1.000px;
}

/* 底部区：高度固定，内容在「刻度尺」与「开抢倒计时」之间切换，避免卡片跳动 */
.fp-bottom {
  width: 100%;
  height: 31.000px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.fp-hide {
  /* 用 !important 保证不被后面的 .fp-countdown{display:flex} 覆盖 */
  display: none !important;
}

.fp-ruler-labels {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.000px;
}

.fp-ruler-label {
  font-size: 10.000px;
  color: rgba(255, 255, 255, 0.55);
}

.fp-ruler-track {
  position: relative;
  height: 3.000px;
  margin-top: 4.000px;
  border-radius: 1.500px;
  background: rgba(255, 255, 255, 0.22);
}

.fp-ruler-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: 1.500px;
  background: linear-gradient(90deg, #d1553a, #ee5a2e);
}

.fp-ruler-knob {
  position: absolute;
  top: 50%;
  width: 9.000px;
  height: 9.000px;
  margin-left: -4.500px;
  border-radius: 50%;
  background: #ee5a2e;
  border: 1.500px solid rgba(255, 255, 255, 0.85);
  transform: translateY(-50%);
  box-sizing: border-box;
}

/* 状态二：性能监控 */
.fp-perf {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.fp-hz {
  font-size: 13.000px;
  color: rgba(255, 255, 255, 0.72);
}

.fp-net {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.fp-net-line {
  font-size: 11.000px;
  color: rgba(255, 255, 255, 0.72);
  line-height: 1.5;
}
.tabbar-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  padding: 0 12.000px calc(8.000px + env(safe-area-inset-bottom));
}

/* 弹层打开时整体隐藏（含安全区内边距） */
.tabbar-hide {
  display: none;
}

.tabbar {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 62.000px;
  border-radius: 31.000px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 6.000px 17.000px rgba(120, 140, 180, 0.22);
  padding: 0 5.000px;
}

.tab-item {
  flex: 1 1 0;
  max-width: 110.000px;
  height: 50.000px;
  margin: 0 3.000px;
  border-radius: 15.000px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.tab-on {
  background: linear-gradient(180deg, #e8f1ff 0%, #dfeafd 100%);
}

.tab-icon {
  width: 22.000px;
  height: 22.000px;
}

.tab-text {
  margin-top: 4.000px;
  font-size: 11.000px;
  color: #2c3140;
  white-space: nowrap;
}

.tab-on .tab-text {
  color: #2f6fd0;
  font-weight: 600;
}
</style>
