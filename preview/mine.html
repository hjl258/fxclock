<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我的</title>
<style>
html, body { margin: 0; padding: 0; width: 375px; }
img { object-fit: contain; display: block; }
.switch-el { -webkit-appearance: none; appearance: none; width: 42px; height: 24px; border-radius: 12px; background: #e2e6ee; position: relative; }
.switch-el:checked { background: #3b7ff0; }
.switch-el::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
.switch-el:checked::after { left: 20px; }
body {
  background: #eef1f7;
  color: #1b1f2a;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14.000px;
  -webkit-font-smoothing: antialiased;
}

.body {
  position: relative;
  min-height: 100vh;
}

/* 背景：柔和径向渐变 + 斜向光带 */
.bg {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
  background:
    radial-gradient(52% 38% at 84% 58%, rgba(118, 226, 212, 0.40) 0%, rgba(118, 226, 212, 0) 70%),
    radial-gradient(44% 30% at 4% 60%, rgba(246, 192, 212, 0.50) 0%, rgba(246, 192, 212, 0) 72%),
    radial-gradient(70% 34% at 52% 100%, rgba(176, 202, 255, 0.55) 0%, rgba(176, 202, 255, 0) 72%),
    linear-gradient(180deg, #f3f5fa 0%, #e9edf6 52%, #e5eaf5 100%);
}

.bg-band {
  position: fixed;
  left: -30%;
  top: 30%;
  width: 160%;
  height: 34%;
  z-index: 0;
  transform: rotate(-9deg);
  background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 48%, rgba(255, 255, 255, 0) 100%);
}

.page-body {
  position: relative;
  z-index: 1;
  padding-bottom: 110.000px;
}

/* 自定义导航栏 */
.nav {
  position: relative;
  z-index: 2;
  box-sizing: content-box;
}

.nav-row {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 12.000px 0 16.000px;
}

.nav-title {
  font-size: 21.000px;
  font-weight: 700;
  color: #16181f;
  letter-spacing: 0.500px;
}

.nav-gap {
  flex: 1;
}



.tap {
  opacity: 0.7;
}

/* 通用卡片 */
.card-skin {
  background: linear-gradient(150deg, #eef6fe 0%, #e9f0fd 58%, #eaf1fb 100%);
  border-radius: 14.000px;
  box-shadow: 0 6.000px 15.000px rgba(120, 150, 200, 0.10);
}

/* 主按钮 */
.primary-btn {
  margin: 8.000px 14.000px 0;
  height: 52.000px;
  border-radius: 13.000px;
  background: linear-gradient(135deg, #5aa9f8 0%, #3b7ff0 56%, #2f6ff0 100%);
  box-shadow: 0 7.000px 15.000px rgba(59, 127, 240, 0.32);
  color: #ffffff;
  font-size: 18.000px;
  font-weight: 600;
  letter-spacing: 1.500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 分段控件 */
.seg {
  display: flex;
  align-items: center;
  background: #eef1f8;
  border-radius: 8.000px;
  padding: 2.000px;
}

.seg-item {
  padding: 5.000px 10.000px;
  font-size: 12.000px;
  color: #5a6478;
  border-radius: 6.000px;
}

.seg-on {
  background: #ffffff;
  color: #2f6fd0;
  font-weight: 600;
  box-shadow: 0 2.000px 5.000px rgba(140, 160, 200, 0.20);
}

.seg-lg .seg-item {
  flex: 1;
  text-align: center;
  padding: 8.000px 0;
  font-size: 13.000px;
}

/* 行设置 */
.row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.16);
}

.row-item:last-child {
  border-bottom: none;
}

.row-label {
  font-size: 14.000px;
  color: #2c3140;
}

.row-value {
  font-size: 13.000px;
  color: #8b93a7;
}

.switch-s {
  transform: scale(0.78);
}

/* 底部弹层 */
.mask {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  background: rgba(18, 24, 38, 0.34);
  /* 必须高于自定义 TabBar(z-index 60)，否则弹层会被底栏压住 */
  z-index: 300;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 301;
  background: #ffffff;
  border-radius: 17.000px 17.000px 0 0;
  /* 只留左右内边距：上下留白挪进标题栏/滚动区，否则弹层边缘会出现
     既不能滚、又会把触摸放给页面的死区 */
  padding: 0 16.000px;
  box-shadow: 0 -6.000px 20.000px rgba(30, 45, 80, 0.18);
  max-height: 78vh;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden; /* 滚动交给里面的 scroll-view，页面本身不再滚 */
}

/* 弹层主体：撑满剩余高度，自身可滚
   （真机的滚动由 <scroll-view scroll-y> 处理，overflow 是给网页预览兜底的） */
.sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding-bottom: calc(24.000px + env(safe-area-inset-bottom));
}

.sheet-head {
  padding-top: 16.000px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6.000px;
}

.sheet-title {
  font-size: 17.000px;
  font-weight: 700;
  color: #16181f;
}

.sheet-close {
  width: 20.000px;
  height: 20.000px;
  opacity: 0.5;
}

.sheet-group {
  margin-top: 13.000px;
}

.sheet-group-title {
  font-size: 12.000px;
  color: #8b93a7;
  letter-spacing: 0.500px;
}

.radio-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 46.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.14);
}

.radio-row:last-child {
  border-bottom: none;
}

.radio-label {
  font-size: 14.000px;
  color: #2c3140;
}

.radio-icon {
  width: 20.000px;
  height: 20.000px;
}

/* 页面级标题 */
.section-title {
  display: flex;
  align-items: baseline;
  margin: 13.000px 16.000px 0;
}

.section-title-main {
  font-size: 17.000px;
  font-weight: 700;
  color: #16181f;
}

.section-title-sub {
  margin-left: 7.000px;
  font-size: 12.000px;
  color: #8b93a7;
}

.mono {
  font-family: "DIN Alternate", "SF Pro Display", "Helvetica Neue", -apple-system, sans-serif;
  font-variant-numeric: tabular-nums;
}
.nav-title {
  font-size: 21.000px;
  font-weight: 700;
  color: #16181f;
}

.profile {
  display: flex;
  align-items: center;
  margin: 11.000px 14.000px 0;
  padding: 15.000px 13.000px;
  border-radius: 15.000px;
  background: linear-gradient(150deg, #eef6fe 0%, #e8f0fd 60%, #eaf1fb 100%);
  box-shadow: 0 6.000px 15.000px rgba(120, 150, 200, 0.14);
}

.avatar {
  flex: none;
  width: 52.000px;
  height: 52.000px;
  border-radius: 50%;
  background: linear-gradient(160deg, #6cb0f8 0%, #3b7ff0 100%);
  box-shadow: 0 5.000px 11.000px rgba(59, 127, 240, 0.28);
  display: flex;
  align-items: center;
  justify-content: center;
}

.avatar-icon {
  width: 28.000px;
  height: 28.000px;
}

.profile-info {
  flex: 1;
  margin-left: 11.000px;
}

.profile-name {
  display: block;
  font-size: 16.000px;
  font-weight: 700;
  color: #16181f;
}

.profile-sub {
  display: block;
  margin-top: 5.000px;
  font-size: 11.000px;
  color: #8b93a7;
}

.group {
  margin: 11.000px 14.000px 0;
  padding: 2.000px 13.000px;
  border-radius: 14.000px;
  background: rgba(255, 255, 255, 0.86);
  box-shadow: 0 6.000px 14.000px rgba(120, 150, 200, 0.10);
}

.row-left {
  display: flex;
  align-items: center;
}

.row-icon {
  width: 20.000px;
  height: 20.000px;
  margin-right: 8.000px;
}

.row-right {
  display: flex;
  align-items: center;
}

.row-chevron {
  width: 13.000px;
  height: 13.000px;
  margin-left: 4.000px;
}

.footer {
  margin: 20.000px 0 0;
  text-align: center;
  font-size: 11.000px;
  color: #a8afbd;
}

.page-body {
  padding-bottom: 120.000px;
}
.tabbar-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  padding: 0 12.000px calc(8.000px + env(safe-area-inset-bottom));
}

/* 弹层打开时整体隐藏（含安全区内边距） */
.tabbar-hide {
  display: none;
}

.tabbar {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 62.000px;
  border-radius: 31.000px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 6.000px 17.000px rgba(120, 140, 180, 0.22);
  padding: 0 5.000px;
}

.tab-item {
  flex: 1 1 0;
  max-width: 110.000px;
  height: 50.000px;
  margin: 0 3.000px;
  border-radius: 15.000px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.tab-on {
  background: linear-gradient(180deg, #e8f1ff 0%, #dfeafd 100%);
}

.tab-icon {
  width: 22.000px;
  height: 22.000px;
}

.tab-text {
  margin-top: 4.000px;
  font-size: 11.000px;
  color: #2c3140;
  white-space: nowrap;
}

.tab-on .tab-text {
  color: #2f6fd0;
  font-weight: 600;
}
</style>
