<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页 · 倒计时</title>
<style>
html, body { margin: 0; padding: 0; width: 375px; }
img { object-fit: contain; display: block; }
.switch-el { -webkit-appearance: none; appearance: none; width: 42px; height: 24px; border-radius: 12px; background: #e2e6ee; position: relative; }
.switch-el:checked { background: #3b7ff0; }
.switch-el::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: none; }
.switch-el:checked::after { left: 20px; }
body {
  background: #eef1f7;
  color: #1b1f2a;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14.000px;
  -webkit-font-smoothing: antialiased;
}

.body {
  position: relative;
  min-height: 100vh;
}

/* 背景：柔和径向渐变 + 斜向光带 */
.bg {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
  background:
    radial-gradient(52% 38% at 84% 58%, rgba(118, 226, 212, 0.40) 0%, rgba(118, 226, 212, 0) 70%),
    radial-gradient(44% 30% at 4% 60%, rgba(246, 192, 212, 0.50) 0%, rgba(246, 192, 212, 0) 72%),
    radial-gradient(70% 34% at 52% 100%, rgba(176, 202, 255, 0.55) 0%, rgba(176, 202, 255, 0) 72%),
    linear-gradient(180deg, #f3f5fa 0%, #e9edf6 52%, #e5eaf5 100%);
}

.bg-band {
  position: fixed;
  left: -30%;
  top: 30%;
  width: 160%;
  height: 34%;
  z-index: 0;
  transform: rotate(-9deg);
  background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 48%, rgba(255, 255, 255, 0) 100%);
}

.page-body {
  position: relative;
  z-index: 1;
  padding-bottom: 110.000px;
}

/* 自定义导航栏 */
.nav {
  position: relative;
  z-index: 2;
  box-sizing: content-box;
}

.nav-row {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 12.000px 0 16.000px;
}

.nav-title {
  font-size: 21.000px;
  font-weight: 700;
  color: #16181f;
  letter-spacing: 0.500px;
}

.nav-gap {
  flex: 1;
}

.vip-pill {
  display: flex;
  align-items: center;
  height: 24.000px;
  padding: 0 8.000px 0 9.000px;
  margin-left: 10.000px;
  border-radius: 12.000px;
  background: linear-gradient(180deg, #fbe8c2 0%, #f2d59a 100%);
  box-shadow: 0 2.000px 5.000px rgba(203, 160, 84, 0.22);
}

.vip-text {
  font-size: 12.000px;
  font-weight: 600;
  color: #8a5a1c;
}

.vip-icon {
  width: 13.000px;
  height: 13.000px;
  margin-left: 3.000px;
}

.gear-btn {
  width: 38.000px;
  height: 38.000px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ffffff, #eef1f8);
  box-shadow: 0 4.000px 10.000px rgba(140, 160, 200, 0.20), inset 0 0 0 0.500px rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
}

.gear-icon {
  width: 20.000px;
  height: 20.000px;
}

.tap {
  opacity: 0.7;
}

/* 通用卡片 */
.card-skin {
  background: linear-gradient(150deg, #eef6fe 0%, #e9f0fd 58%, #eaf1fb 100%);
  border-radius: 14.000px;
  box-shadow: 0 6.000px 15.000px rgba(120, 150, 200, 0.10);
}

/* 主按钮 */
.primary-btn {
  margin: 8.000px 14.000px 0;
  height: 52.000px;
  border-radius: 13.000px;
  background: linear-gradient(135deg, #5aa9f8 0%, #3b7ff0 56%, #2f6ff0 100%);
  box-shadow: 0 7.000px 15.000px rgba(59, 127, 240, 0.32);
  color: #ffffff;
  font-size: 18.000px;
  font-weight: 600;
  letter-spacing: 1.500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 分段控件 */
.seg {
  display: flex;
  align-items: center;
  background: #eef1f8;
  border-radius: 8.000px;
  padding: 2.000px;
}

.seg-item {
  padding: 5.000px 10.000px;
  font-size: 12.000px;
  color: #5a6478;
  border-radius: 6.000px;
}

.seg-on {
  background: #ffffff;
  color: #2f6fd0;
  font-weight: 600;
  box-shadow: 0 2.000px 5.000px rgba(140, 160, 200, 0.20);
}

.seg-lg .seg-item {
  flex: 1;
  text-align: center;
  padding: 8.000px 0;
  font-size: 13.000px;
}

/* 行设置 */
.row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.16);
}

.row-item:last-child {
  border-bottom: none;
}

.row-label {
  font-size: 14.000px;
  color: #2c3140;
}

.row-value {
  font-size: 13.000px;
  color: #8b93a7;
}

.switch-s {
  transform: scale(0.78);
}

/* 底部弹层 */
.mask {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  background: rgba(18, 24, 38, 0.34);
  /* 必须高于自定义 TabBar(z-index 60)，否则弹层会被底栏压住 */
  z-index: 300;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 301;
  background: #ffffff;
  border-radius: 17.000px 17.000px 0 0;
  padding: 16.000px 16.000px calc(30.000px + env(safe-area-inset-bottom));
  box-shadow: 0 -6.000px 20.000px rgba(30, 45, 80, 0.18);
  max-height: 78vh;
  box-sizing: border-box;
  overflow-y: auto;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6.000px;
}

.sheet-title {
  font-size: 17.000px;
  font-weight: 700;
  color: #16181f;
}

.sheet-close {
  width: 20.000px;
  height: 20.000px;
  opacity: 0.5;
}

.sheet-group {
  margin-top: 13.000px;
}

.sheet-group-title {
  font-size: 12.000px;
  color: #8b93a7;
  letter-spacing: 0.500px;
}

.radio-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 46.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.14);
}

.radio-row:last-child {
  border-bottom: none;
}

.radio-label {
  font-size: 14.000px;
  color: #2c3140;
}

.radio-icon {
  width: 20.000px;
  height: 20.000px;
}

/* 页面级标题 */
.section-title {
  display: flex;
  align-items: baseline;
  margin: 13.000px 16.000px 0;
}

.section-title-main {
  font-size: 17.000px;
  font-weight: 700;
  color: #16181f;
}

.section-title-sub {
  margin-left: 7.000px;
  font-size: 12.000px;
  color: #8b93a7;
}

.mono {
  font-family: "DIN Alternate", "SF Pro Display", "Helvetica Neue", -apple-system, sans-serif;
  font-variant-numeric: tabular-nums;
}
/* ---------- 灵动岛 ---------- */
.island-wrap {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  margin-top: 3.000px;
}

.island {
  display: flex;
  align-items: center;
  height: 34.000px;
  padding: 0 14.000px;
  border-radius: 17.000px;
  background: linear-gradient(160deg, #12151f 0%, #05070d 100%);
  box-shadow: 0 6.000px 13.000px rgba(10, 14, 24, 0.28);
}

.island-dot {
  width: 6.000px;
  height: 6.000px;
  border-radius: 50%;
  background: #3ddc84;
  margin-right: 7.000px;
  box-shadow: 0 0 6.000px rgba(61, 220, 132, 0.9);
}

.island-time {
  font-size: 15.000px;
  font-weight: 600;
  color: #ffffff;
  letter-spacing: 0.500px;
}

.island-sep {
  margin: 0 6.000px;
  font-size: 11.000px;
  color: rgba(255, 255, 255, 0.24);
}

.island-cd {
  font-size: 12.000px;
  color: #7fd4ff;
}

/* ---------- 抢购卡片 ---------- */
.event-card {
  position: relative;
  margin: 9.000px 14.000px 0;
  padding: 13.000px 13.000px 11.000px;
  border-radius: 14.000px;
  overflow: hidden;
  background: linear-gradient(150deg, #eef6fe 0%, #e8f0fd 58%, #eaf1fb 100%);
  box-shadow: 0 6.000px 15.000px rgba(120, 150, 200, 0.12);
}

.ribbon {
  position: absolute;
  right: 0;
  top: 0;
  width: 33.000px;
  height: 33.000px;
  border-bottom-left-radius: 13.000px;
  background: linear-gradient(180deg, #ddecfd 0%, #cbe0fc 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.ribbon-icon {
  width: 18.000px;
  height: 18.000px;
  margin-left: 4.000px;
  margin-top: -3.000px;
}

.event-head {
  display: flex;
  align-items: center;
  padding-right: 30.000px;
}

.event-thumb {
  flex: none;
  width: 23.000px;
  height: 23.000px;
  border-radius: 6.500px;
  margin-right: 8.000px;
  background: linear-gradient(160deg, #5aa9f6 0%, #2f78ee 100%);
  box-shadow: 0 3.000px 7.000px rgba(47, 120, 238, 0.28);
  display: flex;
  align-items: center;
  justify-content: center;
}

.event-thumb-icon {
  width: 15.000px;
  height: 15.000px;
}

.event-title {
  flex: 1;
  font-size: 14.000px;
  color: #1b1f2a;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.event-mid {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-top: 9.000px;
}

.price {
  display: flex;
  align-items: baseline;
  color: #ff6a00;
}

.price-sym {
  font-size: 13.000px;
  font-weight: 600;
  margin-right: 2.000px;
}

.price-num {
  font-size: 21.000px;
  font-weight: 700;
  letter-spacing: 0.500px;
}

.cd-label {
  font-size: 12.000px;
  color: #8b93a7;
}

.event-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8.000px;
}

.event-target {
  font-size: 13.000px;
  color: #8b93a7;
}

.digits {
  display: flex;
  align-items: center;
}

.digit {
  min-width: 28.000px;
  height: 28.000px;
  padding: 0 3.000px;
  border-radius: 6.000px;
  background: #ffffff;
  box-shadow: 0 2.000px 6.000px rgba(120, 150, 200, 0.14);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16.000px;
  font-weight: 700;
  color: #1b1f2a;
}

.colon {
  font-size: 13.000px;
  color: #8b93a7;
  margin: 0 4.000px;
}

.digit-last {
  margin-left: 9.000px;
  min-width: 24.000px;
}

.card-live {
  background: linear-gradient(150deg, #fff1ec 0%, #ffe7e0 100%);
  box-shadow: 0 6.000px 15.000px rgba(255, 120, 80, 0.18);
}

.card-live .cd-label,
.card-live .price,
.card-live .price-num {
  color: #ff4d2d;
}

.card-done {
  opacity: 0.72;
}

/* ---------- 环形时钟 ---------- */
.ring-wrap {
  display: flex;
  justify-content: center;
  margin-top: 28.000px;
}

/* ---------- 快捷入口 ---------- */
.quick {
  display: flex;
  margin: 36.000px 10.000px 0;
}

.quick-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.quick-circle {
  width: 56.000px;
  height: 56.000px;
  border-radius: 50%;
  background: linear-gradient(180deg, #fdfeff 0%, #eef1f8 100%);
  box-shadow: 0 5.000px 12.000px rgba(140, 160, 200, 0.16), inset 0 0 0 0.500px rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
}

.quick-on {
  background: linear-gradient(180deg, #e9f2ff 0%, #dae8fd 100%);
  box-shadow: 0 5.000px 12.000px rgba(90, 150, 240, 0.22), inset 0 0 0 0.500px rgba(255, 255, 255, 0.9);
}

.quick-icon {
  width: 24.000px;
  height: 24.000px;
}

.quick-label-row {
  display: flex;
  align-items: center;
  margin-top: 7.000px;
}

.quick-label {
  margin-top: 7.000px;
  font-size: 12.000px;
  color: #2c3140;
}

.quick-label-row .quick-label {
  margin-top: 0;
}

.quick-arrow {
  margin-left: 2.000px;
  font-size: 12.000px;
  color: #8b93a7;
}

.quick-caret {
  width: 12.000px;
  height: 12.000px;
  margin-left: 2.000px;
}

/* ---------- 收起 / 展开 ---------- */
.collapse {
  display: flex;
  justify-content: center;
  margin: 15.000px 0 3.000px;
}

.collapse-icon {
  width: 18.000px;
  height: 18.000px;
  opacity: 0.6;
}

.panel {
  margin: 6.000px 14.000px 0;
  padding: 2.000px 13.000px;
  border-radius: 12.000px;
  background: rgba(255, 255, 255, 0.74);
  box-shadow: 0 5.000px 12.000px rgba(140, 160, 200, 0.12);
}

.panel-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 50.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.16);
}

.panel-row:last-child {
  border-bottom: none;
}

.panel-label {
  font-size: 14.000px;
  color: #2c3140;
}

/* ---------- 弹层补充 ---------- */
.radio-left {
  display: flex;
  flex-direction: column;
}

.radio-desc {
  margin-top: 3.000px;
  font-size: 11.000px;
  color: #98a0b3;
}

.seg-top {
  margin-top: 8.000px;
}

.sheet-btn {
  margin-top: 20.000px;
}
.ring {
  position: relative;
}

.ring-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.ring-center {
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.ring-badge {
  width: 46.000px;
  height: 46.000px;
  border-radius: 13.000px;
  background: linear-gradient(180deg, #f2f4ff 0%, #e9ecfb 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 13.000px;
}

.ring-badge-icon {
  width: 25.000px;
  height: 25.000px;
}

.ring-time {
  font-size: 36.000px;
  font-weight: 700;
  color: #1b1f2a;
  letter-spacing: 0.500px;
  line-height: 1;
}

.ring-time.t-sm {
  font-size: 27.000px;
}

.ring-time.t-md {
  font-size: 36.000px;
}

.ring-sub {
  margin-top: 10.000px;
  font-size: 13.000px;
  color: #98a0b3;
  letter-spacing: 0.500px;
}
.float-root {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 80;
}

.float-mask {
  position: absolute;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  background: rgba(12, 16, 28, 0.46);
}

.float-hint {
  position: absolute;
  left: 0;
  right: 0;
  top: 60.000px;
  text-align: center;
  font-size: 12.000px;
  color: rgba(255, 255, 255, 0.72);
  letter-spacing: 0.500px;
}

.float-area {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
}

.float-pill {
  display: flex;
  align-items: center;
  padding: 0 16.000px;
  border-radius: 33.000px;
  background: linear-gradient(160deg, #101320 0%, #05070e 100%);
  box-shadow: 0 9.000px 20.000px rgba(0, 0, 0, 0.45), inset 0 0 0 0.500px rgba(255, 255, 255, 0.06);
  box-sizing: border-box;
}

.pill-left {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 17.000px;
  margin-right: 10.000px;
}

.pill-dot {
  width: 8.000px;
  height: 8.000px;
  border-radius: 50%;
  background: #3ddc84;
  box-shadow: 0 0 7.000px rgba(61, 220, 132, 0.9);
}

.pill-body {
  flex: 1;
}

.pill-time {
  font-size: 27.000px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.1;
  letter-spacing: 0.500px;
}

.pill-meta {
  margin-top: 3.000px;
  display: flex;
  align-items: center;
}

.pill-sub {
  font-size: 11.000px;
  color: rgba(255, 255, 255, 0.55);
}

.pill-sep {
  margin: 0 6.000px;
  font-size: 10.000px;
  color: rgba(255, 255, 255, 0.25);
}

.pill-cd {
  font-size: 11.000px;
  color: rgba(120, 210, 255, 0.9);
}

.float-close {
  position: absolute;
  left: 50%;
  bottom: 100.000px;
  transform: translateX(-50%);
  height: 42.000px;
  padding: 0 28.000px;
  border-radius: 21.000px;
  background: rgba(255, 255, 255, 0.94);
  color: #1b1f2a;
  font-size: 15.000px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6.000px 15.000px rgba(0, 0, 0, 0.28);
}
.tabbar-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  padding: 0 12.000px calc(8.000px + env(safe-area-inset-bottom));
}

.tabbar {
  display: flex;
  align-items: center;
  height: 62.000px;
  border-radius: 31.000px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 6.000px 17.000px rgba(120, 140, 180, 0.22);
  padding: 0 5.000px;
}

.tab-item {
  flex: 1;
  height: 50.000px;
  margin: 0 2.000px;
  border-radius: 15.000px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.tab-on {
  background: linear-gradient(180deg, #e8f1ff 0%, #dfeafd 100%);
}

.tab-icon {
  width: 22.000px;
  height: 22.000px;
}

.tab-text {
  margin-top: 4.000px;
  font-size: 11.000px;
  color: #2c3140;
}

.tab-on .tab-text {
  color: #2f6fd0;
  font-weight: 600;
}
</style>
