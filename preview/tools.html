<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小工具</title>
<style>
html, body { margin: 0; padding: 0; width: 375px; }
img { object-fit: contain; display: block; }
.switch-el { -webkit-appearance: none; appearance: none; width: 42px; height: 24px; border-radius: 12px; background: #e2e6ee; position: relative; }
.switch-el:checked { background: #3b7ff0; }
.switch-el::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: none; }
.switch-el:checked::after { left: 20px; }
body {
  background: #eef1f7;
  color: #1b1f2a;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 14.000px;
  -webkit-font-smoothing: antialiased;
}

.body {
  position: relative;
  min-height: 100vh;
}

/* 背景：柔和径向渐变 + 斜向光带 */
.bg {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
  background:
    radial-gradient(52% 38% at 84% 58%, rgba(118, 226, 212, 0.40) 0%, rgba(118, 226, 212, 0) 70%),
    radial-gradient(44% 30% at 4% 60%, rgba(246, 192, 212, 0.50) 0%, rgba(246, 192, 212, 0) 72%),
    radial-gradient(70% 34% at 52% 100%, rgba(176, 202, 255, 0.55) 0%, rgba(176, 202, 255, 0) 72%),
    linear-gradient(180deg, #f3f5fa 0%, #e9edf6 52%, #e5eaf5 100%);
}

.bg-band {
  position: fixed;
  left: -30%;
  top: 30%;
  width: 160%;
  height: 34%;
  z-index: 0;
  transform: rotate(-9deg);
  background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 48%, rgba(255, 255, 255, 0) 100%);
}

.page-body {
  position: relative;
  z-index: 1;
  padding-bottom: 110.000px;
}

/* 自定义导航栏 */
.nav {
  position: relative;
  z-index: 2;
  box-sizing: content-box;
}

.nav-row {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 12.000px 0 16.000px;
}

.nav-title {
  font-size: 21.000px;
  font-weight: 700;
  color: #16181f;
  letter-spacing: 0.500px;
}

.nav-gap {
  flex: 1;
}

.vip-pill {
  display: flex;
  align-items: center;
  height: 24.000px;
  padding: 0 8.000px 0 9.000px;
  margin-left: 10.000px;
  border-radius: 12.000px;
  background: linear-gradient(180deg, #fbe8c2 0%, #f2d59a 100%);
  box-shadow: 0 2.000px 5.000px rgba(203, 160, 84, 0.22);
}

.vip-text {
  font-size: 12.000px;
  font-weight: 600;
  color: #8a5a1c;
}

.vip-icon {
  width: 13.000px;
  height: 13.000px;
  margin-left: 3.000px;
}

.gear-btn {
  width: 38.000px;
  height: 38.000px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ffffff, #eef1f8);
  box-shadow: 0 4.000px 10.000px rgba(140, 160, 200, 0.20), inset 0 0 0 0.500px rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
}

.gear-icon {
  width: 20.000px;
  height: 20.000px;
}

.tap {
  opacity: 0.7;
}

/* 通用卡片 */
.card-skin {
  background: linear-gradient(150deg, #eef6fe 0%, #e9f0fd 58%, #eaf1fb 100%);
  border-radius: 14.000px;
  box-shadow: 0 6.000px 15.000px rgba(120, 150, 200, 0.10);
}

/* 主按钮 */
.primary-btn {
  margin: 8.000px 14.000px 0;
  height: 52.000px;
  border-radius: 13.000px;
  background: linear-gradient(135deg, #5aa9f8 0%, #3b7ff0 56%, #2f6ff0 100%);
  box-shadow: 0 7.000px 15.000px rgba(59, 127, 240, 0.32);
  color: #ffffff;
  font-size: 18.000px;
  font-weight: 600;
  letter-spacing: 1.500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 分段控件 */
.seg {
  display: flex;
  align-items: center;
  background: #eef1f8;
  border-radius: 8.000px;
  padding: 2.000px;
}

.seg-item {
  padding: 5.000px 10.000px;
  font-size: 12.000px;
  color: #5a6478;
  border-radius: 6.000px;
}

.seg-on {
  background: #ffffff;
  color: #2f6fd0;
  font-weight: 600;
  box-shadow: 0 2.000px 5.000px rgba(140, 160, 200, 0.20);
}

.seg-lg .seg-item {
  flex: 1;
  text-align: center;
  padding: 8.000px 0;
  font-size: 13.000px;
}

/* 行设置 */
.row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.16);
}

.row-item:last-child {
  border-bottom: none;
}

.row-label {
  font-size: 14.000px;
  color: #2c3140;
}

.row-value {
  font-size: 13.000px;
  color: #8b93a7;
}

.switch-s {
  transform: scale(0.78);
}

/* 底部弹层 */
.mask {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  background: rgba(18, 24, 38, 0.34);
  /* 必须高于自定义 TabBar(z-index 60)，否则弹层会被底栏压住 */
  z-index: 300;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 301;
  background: #ffffff;
  border-radius: 17.000px 17.000px 0 0;
  padding: 16.000px 16.000px calc(30.000px + env(safe-area-inset-bottom));
  box-shadow: 0 -6.000px 20.000px rgba(30, 45, 80, 0.18);
  max-height: 78vh;
  box-sizing: border-box;
  overflow-y: auto;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6.000px;
}

.sheet-title {
  font-size: 17.000px;
  font-weight: 700;
  color: #16181f;
}

.sheet-close {
  width: 20.000px;
  height: 20.000px;
  opacity: 0.5;
}

.sheet-group {
  margin-top: 13.000px;
}

.sheet-group-title {
  font-size: 12.000px;
  color: #8b93a7;
  letter-spacing: 0.500px;
}

.radio-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 46.000px;
  border-bottom: 0.500px solid rgba(150, 165, 200, 0.14);
}

.radio-row:last-child {
  border-bottom: none;
}

.radio-label {
  font-size: 14.000px;
  color: #2c3140;
}

.radio-icon {
  width: 20.000px;
  height: 20.000px;
}

/* 页面级标题 */
.section-title {
  display: flex;
  align-items: baseline;
  margin: 13.000px 16.000px 0;
}

.section-title-main {
  font-size: 17.000px;
  font-weight: 700;
  color: #16181f;
}

.section-title-sub {
  margin-left: 7.000px;
  font-size: 12.000px;
  color: #8b93a7;
}

.mono {
  font-family: "DIN Alternate", "SF Pro Display", "Helvetica Neue", -apple-system, sans-serif;
  font-variant-numeric: tabular-nums;
}
.nav-title {
  font-size: 21.000px;
  font-weight: 700;
  color: #16181f;
}

.mini-btn {
  height: 30.000px;
  line-height: 30.000px;
  padding: 0 12.000px;
  border-radius: 15.000px;
  font-size: 12.000px;
  color: #5a6478;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 3.000px 8.000px rgba(120, 150, 200, 0.16);
}

.grid {
  display: flex;
  flex-wrap: wrap;
  margin: 15.000px 8.000px 0;
}

.grid-item {
  width: 25%;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 20.000px;
}

.grid-circle {
  width: 56.000px;
  height: 56.000px;
  border-radius: 50%;
  background: linear-gradient(180deg, #fdfeff 0%, #eef1f8 100%);
  box-shadow: 0 5.000px 12.000px rgba(140, 160, 200, 0.16), inset 0 0 0 0.500px rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
}

.grid-icon {
  width: 25.000px;
  height: 25.000px;
}

.grid-label {
  margin-top: 7.000px;
  font-size: 12.000px;
  color: #2c3140;
}

.grid-desc {
  margin-top: 2.000px;
  font-size: 10.000px;
  color: #98a0b3;
}

.tips {
  margin: 3.000px 14.000px 0;
  padding: 13.000px;
  border-radius: 12.000px;
  background: rgba(255, 255, 255, 0.68);
}

.tips-title {
  display: block;
  font-size: 13.000px;
  font-weight: 600;
  color: #2c3140;
}

.tips-text {
  display: block;
  margin-top: 6.000px;
  font-size: 12.000px;
  line-height: 1.7;
  color: #7c8497;
}

.page-body {
  padding-bottom: 120.000px;
}
.tabbar-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  padding: 0 12.000px calc(8.000px + env(safe-area-inset-bottom));
}

.tabbar {
  display: flex;
  align-items: center;
  height: 62.000px;
  border-radius: 31.000px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 6.000px 17.000px rgba(120, 140, 180, 0.22);
  padding: 0 5.000px;
}

.tab-item {
  flex: 1;
  height: 50.000px;
  margin: 0 2.000px;
  border-radius: 15.000px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.tab-on {
  background: linear-gradient(180deg, #e8f1ff 0%, #dfeafd 100%);
}

.tab-icon {
  width: 22.000px;
  height: 22.000px;
}

.tab-text {
  margin-top: 4.000px;
  font-size: 11.000px;
  color: #2c3140;
}

.tab-on .tab-text {
  color: #2f6fd0;
  font-weight: 600;
}
</style>
</head>

   const outer = R * 0.982\n      for (let i = 0; i < N; i++) {\n        const a = -Math.PI / 2 + (i * 2 * Math.PI) / N\n        const major = i % 5 === 0\n        const inner = outer - (major ? R * 0.062 : R * 0.036)\n        ctx.beginPath()\n        ctx.lineCap = 'round'\n        ctx.lineWidth = major ? Math.max(2, R * 0.0135) : Math.max(1.2, R * 0.0075)\n        ctx.strokeStyle = major ? 'rgba(72, 84, 124, 0.34)' : 'rgba(72, 84, 124, 0.15)'\n        ctx.moveTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer)\n        ctx.lineTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner)\n        ctx.stroke()\n      }\n\n      // 5. 进度弧\n      const rArc = R * 0.862\n      const start = -Math.PI / 2\n      if (progress > 0.004) {\n        ctx.beginPath()\n        ctx.arc(cx, cy, rArc, start, start + Math.min(1, progress) * Math.PI * 2)\n        const g2 = ctx.createLinearGradient(cx - R, cy - R, cx + R * 0.7, cy + R)\n        g2.addColorStop(0, '#c6cdf6')\n        g2.addColorStop(0.5, '#b4bdf2')\n        g2.addColorStop(1, '#a3aff0')\n        ctx.strokeStyle = g2\n        ctx.lineWidth = Math.max(3, R * 0.026)\n        ctx.lineCap = 'round'\n        ctx.stroke()\n      }\n\n      // 6. 四色定位点\n      const dots = [\n        { a: -90, c: '#4fd4e8' },\n        { a: 0, c: '#8b7ce0' },\n        { a: 90, c: '#4fd4e8' },\n        { a: 180, c: '#f2a2b8' }\n      ]\n      for (let i = 0; i < dots.length; i++) {\n        const a = (dots[i].a * Math.PI) / 180\n        ctx.beginPath()\n        ctx.arc(cx + Math.cos(a) * R * 0.93, cy + Math.sin(a) * R * 0.93, Math.max(2.6, R * 0.022), 0, Math.PI * 2)\n        ctx.fillStyle = dots[i].c\n        ctx.fill()\n      }\n\n      // 7. 文字（仅在变化时 setData）\n      let text\n      let sub\n      if (this.data.mode === 'countdown' && this.data.targetTs) {\n        text = time.countdownText(this.data.targetTs, now)\n        sub = '距 ' + time.dayOffsetLabel(this.data.targetTs, now) + ' ' + time.clockLabel(this.data.targetTs)\n      } else {\n var TIME_SRC = "// 时间计算：北京时间 / 本机时间 / 服务器时间（带漂移校准）\nconst BJ_OFFSET = 8 * 60 * 60 * 1000\nconst DAY = 24 * 60 * 60 * 1000\n\nconst SOURCE_LABEL = {\n  beijing: '北京时间',\n  device: '本机时间',\n  server: '服务器时间'\n}\n\nfunction pad(n, len) {\n  let s = String(Math.floor(Math.abs(n)))\n  const width = len || 2\n  while (s.length < width) s = '0' + s\n  return s\n}\n\n// 返回目标时区的“挂钟”字段\nfunction parts(epochMs, source, serverOffset) {\n  const offset = serverOffset || 0\n  let d\n  let utc = false\n  if (source === 'beijing') {\n    d = new Date(epochMs + BJ_OFFSET)\n    utc = true\n  } else if (source === 'server') {\n    d = new Date(epochMs + offset)\n  } else {\n    d = new Date(epochMs)\n  }\n  const g = (name) => (utc ? d['getUTC' + name]() : d['get' + name]())\n  return {\n    year: g('FullYear'),\n    month: g('Month') + 1,\n    date: g('Date'),\n    day: g('Day'),\n    hours: g('Hours'),\n    minutes: g('Minutes'),\n    seconds: g('Seconds'),\n    ms: g('Milliseconds')\n  }\n}\n\nfunction sourceLabel(source) {\n  return SOURCE_LABEL[source] || SOURCE_LABEL.beijing\n}\n\n// 显示模式：0=十分位 1=整秒 2=百分位 3=毫秒\nfunction formatClock(p, mode) {\n  const H = pad(p.hours)\n  const M = pad(p.minutes)\n  const S = pad(p.seconds)\n  const base = H + ':' + M + ':' + S\n  if (mode === 1) return base\n  if (mode === 2) return base + '.' + pad(Math.floor(p.ms / 10), 2)\n  if (mode === 3) return base + '.' + pad(p.ms, 3)\n  return base + '.' + Math.floor(p.ms / 100)\n}\n\nfunction formatDigits(p) {\n  return pad(p.hours) + ':' + pad(p.minutes) + ':' + pad(p.seconds)\n}\n\n// 倒计时拆分（用于卡片数字块）\nfunction countdownParts(targetTs, epochMs) {\n  const remain = Math.max(0, (targetTs || epochMs) - epochMs)\n  return {\n    h: pad(Math.floor(remain / 3600000) % 100),\n    m: pad(Math.floor(remain / 60000) % 60),\n    s: pad(Math.floor(remain / 1000) % 60),\n    t: String(Math.floor((remain % 1000) / 100)),\n    remain\n  }\n}\n\nfunction countdownText(targetTs, epochMs) {\n  const c = countdownParts(targetTs, epochMs)\n  return c.h + ':' + c.m + ':' + c.s\n}\n\n// 以北京时间为基准的当日某个时刻的时间戳\nfunction beijingEpochOf(h, m, s, epochMs) {\n  const p = parts(epochMs, 'beijing')\n  return Date.UTC(p.year, p.month - 1, p.date, h || 0, m || 0, s || 0, 0) - BJ_OFFSET\n}\n\n// 下一次北京时间 hh:mm:ss（当天已过则顺延一天）\nfunction nextBeijing(h, m, s, epochMs) {\n  const now = epochMs || Date.now()\n  let t = beijingEpochOf(h, m, s, now)\n  while (t <= now) t += DAY\n  return t\n}\n\n// 目标日期相对今天的天数描述\nfunction dayOffsetLabel(targetTs, epochMs) {\n  const a = parts(epochMs || Date.now(), 'beijing')\n  const b = parts(targetTs, 'beijing')\n  const da = Date.UTC(a.year, a.month - 1, a.date)\n  const db = Date.UTC(b.year, b.month - 1, b.date)\n  const diff = Math.round((db - da) / DAY)\n  if (diff <= 0) return '今天'\n  return diff + '天后'\n}\n\nfunction clockLabel(ts) {\n  const p = parts(ts, 'beijing')\n  return pad(p.hours) + ':' + pad(p.minutes) + ':' + pad(p.seconds)\n}\n\nfunction dateLabel(ts) {\n  const p = parts(ts, 'beijing')\n  return p.month + '月' + p.date + '日'\n}\n\nfunction fullLabel(ts) {\n  const p = parts(ts, 'beijing')\n  return p.year + '-' + pad(p.month) + '-' + pad(p.date) + ' ' + pad(p.hours) + ':' + pad(p.minutes)\n}\n\n// 解析 \"20:00:00\"\nfunction parseHMS(text) {\n  const arr = String(text || '20:00:00').split(':').map(function (v) { return parseInt(v, 10) || 0 })\n  return { h: arr[0] || 0, m: arr[1] || 0, s: arr[2] || 0 }\n}\n\nmodule.exports = {\n  BJ_OFFSET: BJ_OFFSET,\n  DAY: DAY,\n  pad: pad,\n  parts: parts,\n  sourceLabel: sourceLabel,\n  formatClock: formatClock,\n  formatDigits: formatDigits,\n  countdownParts: countdownParts,\n  countdownText: countdownText,\n  beijingEpochOf: beijingEpochOf,\n  nextBeijing: nextBeijing,\n  dayOffsetLabel: dayOffsetLabel,\n  clockLabel: clockLabel,\n  dateLabel: dateLabel,\n  fullLabel: fullLabel,\n  parseHMS: parseHMS\n}";
