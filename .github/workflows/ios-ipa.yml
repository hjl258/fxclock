name: Build iOS IPA

# 没有 Mac 也能出 IPA：把工程推到 GitHub，这个工作流跑在 GitHub 的 macOS 机器上，
# 产出未签名 IPA 作为 artifact，下载后用 Sideloadly / AltStore 用你的 Apple ID 重签安装。
on:
  # 手动触发（Actions 页右侧的 Run workflow 按钮）
  workflow_dispatch:
    inputs:
      team_id:
        description: '可选：Apple Team ID（填了就出已签名 IPA，需要配好证书）'
        required: false
        default: ''
  # 自动触发：只改 iOS 工程/工作流本身时才跑，省额度
  push:
    branches: [main]
    paths:
      - 'ios-pip/**'
      - '.github/workflows/ios-ipa.yml'

jobs:
  ipa:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-pip
    steps:
      - uses: actions/checkout@v4

      - name: 选最新 Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          echo '--- iOS SDK ---'
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: |
          set -euo pipefail
          xcodegen generate
          echo '--- 工程里的 scheme 与 target（排错用）---'
          xcodebuild -list -project ClockPiP.xcodeproj

      - name: 归档（未签名）
        run: |
          set -o pipefail
          COMMON="-project ClockPiP.xcodeproj -configuration Release -archivePath build/ClockPiP.xcarchive"
          NOSIGN="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          # 优先用 scheme（project.yml 里已声明）；万一没有就退回 -target，避免整轮白跑
          if xcodebuild -list -project ClockPiP.xcodeproj | grep -q '^    ClockPiP$'; then
            echo '==> 用 -scheme ClockPiP 归档'
            xcodebuild archive $COMMON -scheme ClockPiP -destination 'generic/platform=iOS' $NOSIGN
          else
            echo '!! 没有找到 scheme，退回 -target 归档'
            xcodebuild archive $COMMON -target ClockPiP -sdk iphoneos $NOSIGN
          fi

      - name: 打成 IPA
        run: |
          set -euo pipefail
          APP=build/ClockPiP.xcarchive/Products/Applications/ClockPiP.app
          ls -l "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry ClockPiP-unsigned.ipa Payload
          ls -lh ClockPiP-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ClockPiP-unsigned-ipa
          path: ios-pip/build/ClockPiP-unsigned.ipa
          if-no-files-found: error

      - name: （可选）用 TEAM_ID 出已签名 IPA
        if: ${{ inputs.team_id != '' }}
        env:
          TEAM_ID: ${{ inputs.team_id }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          echo "已签名导出还需要在这里配置证书（fastlane match 或 secrets 导入 p12），"
          echo "没配证书的话请直接用上面的未签名 IPA + 重签工具。"
